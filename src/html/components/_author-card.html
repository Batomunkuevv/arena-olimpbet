<li class="authors-page__item">
    <article class="author-card author-card--listing">
        <a href="{{ href }}" class="author-card__link">
            <div class="author-card__image">
                <img src="{{ image }}" alt="{{ name }}" title="{{ name }}" />
            </div>
            <h3 class="author-card__name">{{ name }}</h3>
            <p class="author-card__description">{{ description }}</p>
        </a>
    </article>
</li>
